# Лабораторная работа №1 - gRPC OrderManager (Вариант 21)
## Все файлы проекта с комментариями

### Файл: order.proto
```protobuf
// Указываем версию синтаксиса Protocol Buffers
syntax = "proto3";

// Определяем пакет для нашего сервиса
package order;

// Сервис для управления заказами (контракт API)
service OrderManager {
  // Unary RPC: метод получения статуса заказа по его ID
  rpc GetOrderStatus (OrderRequest) returns (OrderResponse) {}
}

// Сообщение-запрос: содержит идентификатор заказа
message OrderRequest {
  string order_id = 1;
}

// Сообщение-ответ: содержит информацию о текущем состоянии заказа
message OrderResponse {
  string status = 1;        // Статус заказа (например, "Доставлен")
  string delivery_date = 2; // Ожидаемая дата доставки
}

### Файл: server.py
import grpc
from concurrent import futures
import order_pb2
import order_pb2_grpc

# Класс, реализующий логику сервиса OrderManager
class OrderManagerServicer(order_pb2_grpc.OrderManagerServicer):
    def GetOrderStatus(self, request, context):
        print(f"Сервер: Получен запрос для заказа ID: {request.order_id}")
        
        # Логика имитации базы данных
        if request.order_id == "123":
            status = "Доставлен"
            date = "2026-04-24"
        else:
            status = "Не найден"
            date = "N/A"
            
        return order_pb2.OrderResponse(status=status, delivery_date=date)

def serve():
    # Создаем сервер с пулом потоков
    server = grpc.server(futures.ThreadPoolExecutor(max_workers=10))
    # Регистрируем наш сервис
    order_pb2_grpc.add_OrderManagerServicer_to_server(OrderManagerServicer(), server)
    # Настраиваем порт
    server.add_insecure_port('[::]:50051')
    server.start()
    print("Сервер: Запущен на порту 50051...")
    server.wait_for_termination()

if __name__ == '__main__':
    serve()

### Файл: client.py
import grpc
import order_pb2
import order_pb2_grpc

def run():
    # Создаем канал подключения к серверу
    with grpc.insecure_channel('localhost:50051') as channel:
        # Создаем «заглушку» (stub) для вызова методов
        stub = order_pb2_grpc.OrderManagerStub(channel)
        
        # Запрос к серверу
        print("Клиент: Запрашиваю статус заказа №123...")
        request = order_pb2.OrderRequest(order_id="123")
        
        try:
            # Вызов метода и получение ответа
            response = stub.GetOrderStatus(request)
            print(f"Ответ сервера: Статус — {response.status}, Дата — {response.delivery_date}")
        except grpc.RpcError as e:
            print(f"Ошибка при вызове: {e.details()}")

if __name__ == '__main__':
    run()
